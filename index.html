<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вход — LessonBoard</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;font:19px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#14213d;background:radial-gradient(900px 480px at 100% -10%,rgba(79,70,229,.12),transparent 60%),radial-gradient(700px 400px at -5% 5%,rgba(16,185,129,.1),transparent 60%),#f5f7fb}
.box{width:min(420px,92vw);background:#fff;border:1.5px solid #dfe5f1;border-radius:20px;padding:28px;box-shadow:0 10px 30px rgba(79,70,229,.08)}
.brand{font:800 15px ui-monospace,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;color:#4f46e5}
h1{margin:8px 0 18px;font-size:30px}
label{display:block;margin:14px 0 5px;font-weight:600;font-size:17px}
input{width:100%;box-sizing:border-box;font:inherit;padding:12px 14px;border:1.5px solid #dfe5f1;border-radius:12px}
input:focus{outline:3px solid rgba(79,70,229,.22);border-color:#4f46e5}
button{margin-top:20px;width:100%;background:#4f46e5;color:#fff;border:0;border-radius:12px;padding:13px;font:800 18px inherit;cursor:pointer}
#m{margin-top:14px;color:#dc2626;font-weight:600;min-height:24px}
</style></head><body><div class="box"><div class="brand">&lt;LessonBoard/&gt;</div><h1>Вход</h1>
<label for="lg">Логин</label><input id="lg" autocomplete="username" autocapitalize="none">
<label for="pw">Пароль</label><input id="pw" type="password" autocomplete="current-password">
<button id="go">Войти</button><div id="m"></div></div>
<script>
const $=s=>document.querySelector(s);
const hx=async s=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,"0")).join("");
const ses=o=>sessionStorage.setItem("lb_ses",JSON.stringify(o));
async function go(){const m=$("#m");m.textContent="";const lg=$("#lg").value.trim().toLowerCase(),p=$("#pw").value;if(!lg||!p){m.textContent="Введите логин и пароль";return}
 try{const U=await (await fetch("users.json",{cache:"no-store"})).json(),h=await hx(U.salt+lg+":"+p);
  if(U.teacher&&U.teacher.login===lg&&U.teacher.hash===h){ses({role:"teacher",login:lg,name:"Учитель"});location.href="teacher.html";return}
  const s=U.students.find(x=>x.login===lg&&x.hash===h);
  if(s){ses({role:"student",login:lg,name:s.name});location.href="student.html";return}
  m.textContent="Неверный логин или пароль"}catch(e){m.textContent="Не удалось войти. Проверьте интернет и файл users.json"}}
$("#go").onclick=go;document.addEventListener("keydown",e=>{if(e.key==="Enter")go()});
try{const s=JSON.parse(sessionStorage.getItem("lb_ses")||"null");if(s)location.replace(s.role==="teacher"?"teacher.html":"student.html")}catch(e){}
</script></body></html>
