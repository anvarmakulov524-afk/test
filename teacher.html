<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Контейнеры — урок</title>
<style>
:root{--bg:#f5f7fb;--panel:#fff;--soft:#eef2ff;--line:#dfe5f1;--tx:#14213d;--mu:#55658a;--ac:#4f46e5;--ac2:#4338ca;--g:#047857;--gl:#10b981;--pink:#ec4899;--amb:#f59e0b;--sky:#0ea5e9;--red:#dc2626}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font:19px/1.65 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx);background:radial-gradient(900px 480px at 100% -10%,rgba(79,70,229,.10),transparent 60%),radial-gradient(700px 400px at -5% 5%,rgba(16,185,129,.09),transparent 60%),var(--bg);min-height:100vh}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.wrap{max-width:920px;margin:0 auto;padding:0 16px}
header{padding:22px 0 8px}
.hrow{display:flex;align-items:center;gap:14px}
.brand{flex:1;font:800 15px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--ac)}
.lang{display:flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden;background:#fff}
.lang button{background:transparent;color:var(--mu);border:0;padding:7px 15px;font-size:15px;cursor:pointer;font-weight:700}
.lang button.on{background:var(--ac);color:#fff}
.prog{display:flex;align-items:center;gap:12px;margin-top:14px}
.prog .rail{flex:1;height:9px;border-radius:99px;background:#e3e9f6;overflow:hidden}
.prog .rail i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--sky),var(--gl));transition:width .5s}
.prog b{font:800 15px ui-monospace,Menlo,monospace;color:var(--ac);min-width:44px;text-align:right}
nav{position:sticky;top:0;z-index:10;margin-top:12px;padding:10px 0;background:rgba(245,247,251,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav .in{max-width:920px;margin:0 auto;padding:0 16px;display:grid;gap:8px}
nav button{background:#fff;border:1.5px solid var(--line);color:var(--mu);border-radius:14px;padding:9px 4px;font-size:16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;line-height:1.15;font-weight:700;box-shadow:0 1px 2px rgba(20,33,61,.04)}
nav button b{display:grid;place-items:center;width:26px;height:26px;border-radius:8px;background:#e8edf8;font:800 14px ui-monospace,monospace;color:var(--tx)}
nav button.on{border-color:var(--ac);color:var(--ac);background:var(--soft)}
nav button.on b{background:var(--ac);color:#fff}
nav button.dn b{background:var(--gl);color:#fff}
@media(max-width:560px){nav button{font-size:11.5px;padding:8px 2px}nav .in{gap:5px}}
main{padding:22px 0 80px}
.hero{position:relative;overflow:hidden;border:1.5px solid var(--line);border-radius:22px;padding:26px 24px;background:linear-gradient(135deg,#eef2ff,#ecfdf5 70%,#fff);box-shadow:0 10px 30px rgba(79,70,229,.08)}
.kicker{font:800 13px ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--ac)}
h1{margin:6px 0 0;font-size:clamp(34px,7vw,56px);line-height:1.08;font-weight:850;letter-spacing:-.02em;max-width:80%}
h2{font-size:15px;letter-spacing:.14em;text-transform:uppercase;font-family:ui-monospace,Menlo,monospace;color:var(--ac);margin:30px 0 12px;font-weight:800}
h2:before{content:"// ";color:var(--gl)}
h2.pg{font-size:clamp(28px,5vw,38px);text-transform:none;letter-spacing:-.01em;font-family:inherit;color:var(--tx);margin:6px 0 14px;font-weight:800}h2.pg:before{content:""}
.blocks{position:absolute;right:22px;bottom:20px;display:flex;flex-direction:column-reverse;gap:6px;align-items:flex-end}
.blocks i{display:block;height:20px;border-radius:7px;animation:fl 3.2s ease-in-out infinite}
.blocks i:nth-child(1){width:92px;background:var(--gl)}.blocks i:nth-child(2){width:74px;background:var(--ac);animation-delay:.3s}.blocks i:nth-child(3){width:56px;background:var(--pink);animation-delay:.6s}.blocks i:nth-child(4){width:38px;background:var(--amb);animation-delay:.9s}
@keyframes fl{50%{transform:translateX(-8px)}}
@media(prefers-reduced-motion:reduce){.blocks i{animation:none}html{scroll-behavior:auto}}
@media(max-width:600px){.blocks{display:none}h1{max-width:100%}}
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 2px 10px rgba(20,33,61,.04)}
.card.join{border-color:var(--ac);background:linear-gradient(135deg,var(--soft),#fff)}
.goal{display:flex;gap:16px;align-items:flex-start}.goal .n{font:800 34px ui-monospace,monospace;color:var(--ac);line-height:1}
.mu{color:var(--mu);font-size:16px}
.bar{height:12px;background:#e3e9f6;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--sky));transition:width .4s}
.t{display:flex;gap:14px;padding:12px 0;cursor:pointer;align-items:flex-start;margin:0;font-weight:400;font-size:19px}
.t input,.chip input{accent-color:var(--ac)}.t input{width:26px;height:26px;flex:none;margin-top:2px}
input[type=text],textarea,select{width:100%;font:inherit;font-size:18px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--tx)}
input::placeholder,textarea::placeholder{color:#8392b3}
textarea{min-height:84px;resize:vertical}input:focus,textarea:focus,select:focus{outline:3px solid rgba(79,70,229,.22);border-color:var(--ac)}
label{display:block;margin:16px 0 5px;font-weight:600;font-size:17px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:12px 22px;font-size:18px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block;margin:4px 8px 4px 0;box-shadow:0 4px 12px rgba(79,70,229,.25)}
.btn.g{background:var(--g);box-shadow:0 4px 12px rgba(4,120,87,.25)}.btn.ghost{background:#fff;color:var(--ac);border:2px solid var(--ac);box-shadow:none}.btn.sm{padding:8px 16px;font-size:16px;box-shadow:none}
.btn.off{opacity:.38;pointer-events:none}
.ok{border-left:5px solid var(--gl);padding:11px 15px;background:#ecfdf5;border-radius:0 12px 12px 0;margin:14px 0}
.warn{border-left:5px solid var(--amb);padding:11px 15px;background:#fffbeb;border-radius:0 12px 12px 0;margin:14px 0}
pre{margin:12px 0;padding:14px 16px;background:#f1f4fb;border:1px solid var(--line);color:#1e2b4d;border-radius:12px;overflow-x:auto;font:15px/1.6 ui-monospace,Menlo,Consolas,monospace}.cm{color:#5b6b8f}
.lec h3{margin:0 0 6px;font-size:24px;font-weight:800;letter-spacing:-.01em}.lec p{margin:6px 0;color:#2c3a5c}
.demo{margin-top:14px;padding:16px;border-radius:14px;background:#f8faff;border:1.5px dashed #b6c2e4}
.demo .dt{font:800 13px ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;color:#b45309;margin-bottom:10px}
.drow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.drow input[type=text]{width:130px;flex:none}
.out{min-height:30px;margin-top:10px;color:var(--g);font-weight:700;font-size:16px}
.cells{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.cell{display:flex;flex-direction:column;align-items:center;min-width:56px;padding:9px 12px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--tx);font:800 20px ui-monospace,monospace;cursor:default}
button.cell{cursor:pointer}button.cell:hover{box-shadow:0 0 0 3px rgba(79,70,229,.15)}.cell small{font:700 12px ui-monospace,monospace;color:var(--mu);margin-top:2px}
.cell.c0{background:#ecfdf5;border-color:#34d399}.cell.c1{background:#eef2ff;border-color:#818cf8}.cell.c2{background:#fdf2f8;border-color:#f472b6}.cell.c3{background:#fffbeb;border-color:#fbbf24}
.vstack{display:flex;flex-direction:column-reverse;gap:6px;align-items:flex-start;margin:12px 0;min-height:44px}
.vstack .cell{width:150px;flex-direction:row;justify-content:space-between}
.tagl{font:700 13px ui-monospace,monospace;color:var(--mu);margin-left:4px}
.qbar{position:sticky;top:78px;z-index:5;background:rgba(245,247,251,.95);padding:8px 0;margin-bottom:4px}
.qcard b.qn{font:800 15px ui-monospace,monospace;color:var(--ac);letter-spacing:.08em}
.qcard .qt{font-size:20px;font-weight:650;margin:4px 0 8px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;font:inherit;font-size:18px;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;margin:8px 0;cursor:pointer;color:var(--tx)}
.opt i{font-style:normal;font:800 15px ui-monospace,monospace;display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:#e8edf8;flex:none}
.opt:hover{border-color:#a5b4fc}.opt.sel{border-color:var(--ac);background:var(--soft)}.opt.sel i{background:var(--ac);color:#fff}
.emo{display:flex;gap:8px;flex-wrap:wrap}.emo button{font:inherit;font-size:32px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:6px 13px;cursor:pointer;color:var(--tx)}
.emo button.on{border-color:var(--ac);background:var(--soft)}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{display:flex;gap:8px;align-items:center;border:1.5px solid var(--line);border-radius:999px;padding:8px 16px;background:#fff;cursor:pointer;font-size:18px;margin:0;font-weight:500}
.chip input{width:20px;height:20px}.chip.on{border-color:var(--ac);background:var(--soft)}
.rev{padding:12px 14px;border-radius:12px;margin:10px 0;border:1px solid var(--line);background:#fff}.rev.y{background:#ecfdf5;border-color:#86efac}.rev.n{background:#fef2f2;border-color:#fca5a5}
.score{border-radius:18px;padding:16px 20px;margin:14px 0;border:2px solid;background:#fff}
.score .v{font:850 clamp(30px,6vw,42px) ui-monospace,monospace}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:14px 0}
.stat{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:14px 16px}.stat b{display:block;font:850 32px ui-monospace,monospace;color:var(--ac)}.stat span{font-size:15px;color:var(--mu)}
.tw{overflow-x:auto;border:1.5px solid var(--line);border-radius:14px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:16px;min-width:640px}
th{background:var(--soft);text-align:left;padding:10px 12px;font-size:14px;letter-spacing:.04em;color:var(--ac);white-space:nowrap}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}
.pill{display:inline-block;border-radius:999px;padding:2px 11px;font:800 15px ui-monospace,monospace;color:#fff;white-space:nowrap}
.qrow{display:flex;gap:10px;align-items:center;margin:8px 0;font-size:16px}.qrow .qn2{width:34px;font:800 14px ui-monospace,monospace;color:var(--mu);flex:none}
.qrow .qtx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.qrow .bar{width:110px;flex:none}.qrow .pc{width:48px;text-align:right;font:800 14px ui-monospace,monospace}
.sortb{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
nav,.prog{display:none}
</style></head><body>
<header><div class="wrap"><div class="hrow"><span class="brand">&lt;LessonBoard/&gt;</span><button class="btn sm ghost" onclick="logout()" style="margin:0 10px 0 0">Выйти</button><div class="lang"><button data-l="ru" class="on">РУС</button><button data-l="kk">ҚАЗ</button></div></div>
<div class="prog"><div class="rail"><i id="pg"></i></div><b id="pgn">0%</b></div></div></header>
<nav><div class="in" id="nav"></div></nav>
<main><div class="wrap" id="v"></div></main>
<script>
const SES=(()=>{try{return JSON.parse(sessionStorage.getItem("lb_ses")||"null")}catch(e){return null}})();
if(!SES||SES.role!=="teacher")location.replace("index.html");
const logout=()=>{try{sessionStorage.removeItem("lb_ses")}catch(e){}location.replace("index.html")};
const TEACHER_PHONE=""; // номер преподавателя для WhatsApp: международный формат без +, например "77011234567"
// Вкладка «Учитель» открывается, если к адресу страницы добавить #teacher  (например .../lessonboard.html#teacher)

let LESSON={topic:["Тема: Контейнеры","Тақырып: Контейнерлер"],
goals:[["Познакомить с понятием и структурой контейнеров данных в программировании","Бағдарламалауда деректер контейнерлерінің ұғымы мен құрылымымен таныстыру"]],
tasks:[["Научиться объявлять, заполнять и обрабатывать основные контейнеры данных","Деректердің негізгі контейнерлерін жариялауды, толтыруды және өңдеуді үйрену"]]};

let LECT=[
{h:["1. Что такое контейнер данных","1. Деректер контейнері дегеніміз не"],
 p:["Контейнер данных — это структура, в которой хранится и организуется набор элементов. Вместо десяти отдельных переменных мы заводим один контейнер и работаем со всеми значениями сразу: добавляем, ищем, удаляем, перебираем.","Деректер контейнері — элементтер жиынын сақтайтын және ұйымдастыратын құрылым. Он бөлек айнымалының орнына біз бір контейнер құрып, барлық мәнмен бірге жұмыс істейміз: қосамыз, іздейміз, жоямыз, аралаймыз."]},
{h:["2. Массив (список)","2. Массив (тізім)"],
 p:["Массив хранит элементы по порядку. К каждому элементу обращаются по индексу. Индексация начинается с нуля: у первого элемента индекс 0, а у последнего в массиве из n элементов — n − 1.","Массив элементтерді ретімен сақтайды. Әр элементке индекс арқылы жүгінеді. Индекстеу нөлден басталады: бірінші элементтің индексі 0, ал n элементті массивтегі соңғысының индексі n − 1."],
 code:'fruits = ["яблоко", "груша", "слива"]\nprint(fruits[0])        # яблоко\nfruits.append("киви")   # добавили в конец\nfruits.remove("груша")  # удалили элемент\nprint(len(fruits))      # размер: 3',demo:"arr"},
{h:["3. Словарь","3. Сөздік"],
 p:["Словарь хранит пары «ключ — значение». Ключ уникален, по нему значение находится почти мгновенно. Подходит для телефонной книги, справочников, настроек.","Сөздік «кілт — мән» жұптарын сақтайды. Кілт бірегей, мән сол кілт арқылы бірден табылады. Телефон кітапшасына, анықтамалықтарға, баптауларға қолайлы."],
 code:'phones = {"Айгерим": "+7 701 111 22 33", "Данияр": "+7 702 444 55 66"}\nphones["Асет"] = "+7 777 000 11 22"   # добавить пару\nprint(phones["Данияр"])              # получить по ключу\ndel phones["Айгерим"]                # удалить пару',demo:"dict"},
{h:["4. Множество","4. Жиын"],
 p:["Множество хранит только уникальные элементы: одинаковые значения не повторяются. Удобно, чтобы убрать дубликаты и быстро проверить, есть ли значение в наборе.","Жиын тек бірегей элементтерді сақтайды: бірдей мәндер қайталанбайды. Қайталануларды алып тастауға және мәннің жиында бар-жоғын тез тексеруге қолайлы."],
 code:'cities = ["Алматы", "Астана", "Алматы", "Шымкент", "Астана"]\nunique = set(cities)\nprint(unique)              # три уникальных города\nprint("Астана" in unique)  # True',demo:"set"},
{h:["5. Стек: последним пришёл — первым вышел (LIFO)","5. Стек: соңғы келген — бірінші шығады (LIFO)"],
 p:["В стеке добавление и извлечение идут с одного конца — «вершины». Пример: стопка тарелок или кнопка «Отменить» в редакторе.","Стекте қосу мен алу бір жақтан — «төбеден» жүреді. Мысалы: тәрелкелер үйіндісі немесе редактордағы «Болдырмау» түймесі."],
 code:'stack = []\nstack.append(10)\nstack.append(20)\nstack.append(30)\nprint(stack.pop())   # 30, последний добавленный',demo:"stack"},
{h:["6. Очередь: первым пришёл — первым вышел (FIFO)","6. Кезек: бірінші келген — бірінші шығады (FIFO)"],
 p:["В очереди элементы добавляют в конец, а извлекают из начала. Пример: очередь в кассу или печать документов на принтере.","Кезекте элементтер соңына қосылады, ал басынан алынады. Мысалы: кассадағы кезек немесе принтерде құжаттарды басып шығару."],
 code:'from collections import deque\nq = deque()\nq.append(10)\nq.append(20)\nq.append(30)\nprint(q.popleft())   # 10, первый добавленный',demo:"queue"},
{h:["7. Обход и размер контейнера","7. Контейнерді аралау және өлшемі"],
 p:["Обход — это просмотр элементов по очереди, чтобы обработать каждый. Размер контейнера — количество элементов в нём (в Python функция len).","Аралау — әр элементті өңдеу үшін оларды кезекпен қарап шығу. Контейнер өлшемі — ондағы элементтер саны (Python-да len функциясы)."],
 code:'nums = [4, 8, 15, 16]\ntotal = 0\nfor x in nums:           # обход\n    total += x\nprint(total, len(nums))  # 43 4'},
{h:["8. Как выбрать контейнер","8. Контейнерді қалай таңдау керек"],
 p:["Нужен порядок и доступ по номеру — массив. Поиск по ключу — словарь. Только уникальные значения — множество. Отмена действий, возврат назад — стек. Обработка по порядку поступления — очередь.","Реттілік пен нөмір бойынша қолжетімділік керек — массив. Кілт бойынша іздеу — сөздік. Тек бірегей мәндер — жиын. Әрекетті болдырмау, артқа қайту — стек. Түсу реті бойынша өңдеу — кезек."]}
];

// k — индекс верного ответа
const QUIZ=[
{q:["Что такое контейнер данных в программировании?","Бағдарламалауда деректер контейнері дегеніміз не?"],k:1,o:[["Команда, завершающая программу","Бағдарламаны аяқтайтын команда"],["Структура для хранения и организации набора элементов","Элементтер жиынын сақтау және ұйымдастыру құрылымы"],["Устройство вывода информации","Ақпаратты шығару құрылғысы"],["Оператор проверки условия","Шартты тексеру операторы"]]},
{q:["Какой индекс имеет первый элемент массива?","Массивтің бірінші элементінің индексі қандай?"],k:2,o:[["1","1"],["−1","−1"],["0","0"],["Любой, по выбору программиста","Бағдарламашы қалаған кез келген"]]},

const pair=(lb,p,v,ta)=>`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px"><div><span class="mu">РУС · ${lb}</span>${ei(p+".0",v[0],ta)}</div><div><span class="mu">ҚАЗ · ${lb}</span>${ei(p+".1",v[1],ta)}</div></div>`;
function editorV(){
 if(DB&&!CAN)return `<h2>Редактор урока</h2><div class="warn">Менять урок может только владелец страницы.</div>`;
 if(!ED)edInit();
 const sec=(h,x)=>`<div class="card"><b>${h}</b>${x}</div>`;
 return `<h2>Редактор урока</h2><div class="mu">Измените текст и нажмите «Сохранить урок»: у учеников откроется новая версия.</div>`+
 sec("Тема",pair("тема","LESSON.topic",ED.LESSON.topic))+
 sec("Цели",ED.LESSON.goals.map((g,i)=>pair("цель","LESSON.goals."+i,g)).join(""))+
 sec("Задания",ED.LESSON.tasks.map((g,i)=>`<div style="display:flex;gap:8px;align-items:flex-end;margin-top:8px"><div style="flex:1">${pair("задание "+(i+1),"LESSON.tasks."+i,g)}</div><button class="btn sm ghost" data-a="edDelTask" data-i="${i}">✕</button></div>`).join("")+`<button class="btn sm" style="margin-top:10px" data-a="edAddTask">+ Добавить задание</button>`)+
 sec("Лекция",ED.LECT.map((s,i)=>`<div style="border-top:1px solid var(--line);padding-top:10px;margin-top:10px">${pair("заголовок","LECT."+i+".h",s.h)}${pair("текст","LECT."+i+".p",s.p,1)}<span class="mu">Код (необязательно)</span>${ei("LECT."+i+".code",s.code,1)}<button class="btn sm ghost" data-a="edDelSec" data-i="${i}">Удалить раздел</button></div>`).join("")+`<button class="btn sm" style="margin-top:10px" data-a="edAddSec">+ Добавить раздел</button>`)+
 sec("Вопросы рефлексии",RF.map(([k])=>pair("вопрос","RLB."+k,ED.RLB[k])).join(""))+
 `<button class="btn g" data-a="edSave">💾 Сохранить урок</button><button class="btn" data-a="edDl">⬇ Скачать lesson.json</button><button class="btn ghost" data-a="edReset">Вернуть исходный</button><span id="edmsg" class="mu"></span>`}

function render(){const TB=tabs();
$("#nav").style.gridTemplateColumns=`repeat(${TB.length},1fr)`;
$("#nav").innerHTML=TB.map((k,i)=>`<button data-tab="${k}" class="${k===tab?"on":""} ${doneTab(k)?"dn":""}"><b>${k==="teacher"?"★":doneTab(k)?"✓":i+1}</b>${t(k)}</button>`).join("");
document.documentElement.lang=L;$("#v").innerHTML={lesson:lessonV,lecture:lectureV,test:testV,reflect:reflV,send:sendV,teacher:teacherV}[TB.includes(tab)?tab:"lesson"]();updProg()}

document.addEventListener("click",e=>{const b=e.target.closest("button,input");if(!b)return;const d=b.dataset;
if(d.l){L=d.l;document.querySelectorAll(".lang button").forEach(x=>x.classList.toggle("on",x.dataset.l===L));keep(render);return}
if(d.tab){tab=d.tab;render();window.scrollTo(0,0);return}
if(d.a==="join"){const n=$("#nm").value.trim();if(n){S.name=n;saveStudent();render()}return}
if(d.a==="chk"){const i=+d.i;S.done=b.checked?[...new Set([...S.done,i])]:S.done.filter(x=>x!==i);saveStudent();keep(render);return}
if(d.a==="ans"){S.ans[d.i]=+d.j;keep(render);return}
if(d.a==="sub"){if(!sure(b,"sub",Object.keys(S.ans).length<QUIZ.length?t("unans"):t("sure")))return;S.sub=true;saveStudent();render();window.scrollTo(0,0);return}
if(d.a==="mood"){S.r.mood=+d.n;saveStudent();keep(render);return}
if(d.a==="und"){S.r.und=+d.n;saveStudent();keep(render);return}
if(d.a==="conf"){const c=S.r.conf;S.r.conf=b.checked?[...new Set([...c,d.k])]:c.filter(x=>x!==d.k);saveStudent();keep(render);return}
if(d.a==="demo"){demoOp(d.d,d.op,+d.i);keep(render);const f=$("#in-"+d.d)||$("#in-k");if(f&&d.op!=="idx"&&d.op!=="get")f.focus({preventScroll:true});return}
if(d.a==="edDl"){const c=cl(ED);applyContent(cl(c));persist(c);const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(c,null,1)],{type:"application/json"}));a.download="lesson.json";document.body.appendChild(a);a.click();a.remove();return}
if(d.a==="uAdd"){(async()=>{const n=$("#u-name").value.trim(),lg=$("#u-login").value.trim().toLowerCase(),p=$("#u-pass").value;if(!n||!lg||!p)return;const h=await hx(U.salt+lg+":"+p),f=U.students.find(s=>s.login===lg);if(f){f.name=n;f.hash=h}else U.students.push({login:lg,name:n,hash:h});ISSUED.push({name:n,login:lg,pass:p});keep(render)})();return}
if(d.a==="uDel"){if(sure(b,"ud"+d.i)){U.students.splice(+d.i,1);keep(render)}return}
if(d.a==="uDl"){(async()=>{const tp=($("#u-tpass")||{}).value;if(tp&&U.teacher)U.teacher.hash=await hx(U.salt+U.teacher.login+":"+tp);const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(U,null,1)],{type:"application/json"}));a.download="users.json";document.body.appendChild(a);a.click();a.remove()})();return}
if(d.a==="edAddTask"){ED.LESSON.tasks.push(["",""]);keep(render);return}
if(d.a==="edDelTask"){ED.LESSON.tasks.splice(+d.i,1);keep(render);return}
if(d.a==="edAddSec"){ED.LECT.push({h:["",""],p:["",""]});keep(render);return}
if(d.a==="edDelSec"){if(sure(b,"ds"+d.i,"Точно удалить? Нажмите ещё раз")){ED.LECT.splice(+d.i,1);keep(render)}return}
if(d.a==="edSave"){const c=cl(ED);applyContent(cl(c));persist(c);return}
if(d.a==="edReset"){if(sure(b,"rst","Точно вернуть? Нажмите ещё раз")){const c={LESSON:cl(DEF.LESSON),LECT:cl(DEF.LECT),RLB:{}};applyContent(cl(c));ED=null;persist(c);keep(render)}return}
if(d.a==="tsort"){TS.sort=d.s;keep(render);return}
if(d.a==="csv"){csv();return}
 if(d.a==="rosterCsv"){
  const rows=Object.values(rosterGet()).sort((a,b)=>a.name.localeCompare(b.name,"ru"));
  const quote=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
  const data=[["ФИО","Практические пункты","Всего пунктов","Тест отправлен","Баллы теста","Рефлексия завершена","Баллы рефлексии","Обновлено"],
   ...rows.map(r=>[r.name,r.tasksDone||0,r.tasksTotal||tk().length,r.testSubmitted?"Да":"Нет",r.testScore??"",r.reflectionDone?"Да":"Нет",r.reflectionScore??"",r.updatedAt||""])];
  const blob="\\uFEFF"+data.map(row=>row.map(quote).join(";")).join("\\r\\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([blob],{type:"text/csv;charset=utf-8"}));a.download="rezultaty_uchenikov.csv";document.body.appendChild(a);a.click();a.remove();return
 }
 if(d.a==="rosterClear"){if(sure(b,"rc","Точно удалить? Нажмите ещё раз")){rosterSet({});keep(render)}return}
if(d.a==="tclear"){lsSet("");keep(render);return}
if(d.a==="copy"){const ta=$("#rp");ta.select();let ok=false;try{ok=document.execCommand("copy")}catch(x){}
if(!ok&&navigator.clipboard)navigator.clipboard.writeText(ta.value).catch(()=>{});b.textContent=t("copied")}});
document.addEventListener("input",e=>{const d=e.target.dataset;
if(d.p){const k=d.p.split("."),last=k.pop();let o=ED;k.forEach(x=>o=o[x]);o[last]=e.target.value;return}
if(e.target.id==="chat"){lsSet(e.target.value);$("#tres").innerHTML=teacherRes();return}
if(d.f){S.r[d.f]=e.target.value;saveStudent();const bx=$("#rbox");if(bx)bx.innerHTML=rbox();updProg()}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id&&e.target.id.startsWith("in-")){const n=e.target.id.slice(3),dn=(n==="k"||n==="v")?"dict":n,op=(dn==="dict"||dn==="set")?"add":"push";demoOp(dn,op,0);keep(render);const f=$("#in-"+n);if(f)f.focus({preventScroll:true})}
if(e.key==="Enter"&&e.target.id==="nm")$("[data-a=join]").click()});
window.addEventListener("hashchange",render);
render();initCloud();
</script></body></html>
